name: CI

# The standing enforcement gate. Until this existed, the golden-image suite,
# the perf bench, the ABI-size asserts, the render-feature-parity table, and
# the runtime shader compile were all real but ran only when a developer
# remembered to. This workflow runs them automatically on every push and PR.
#
# Runner note: the macOS slice of ThresholdKit builds and tests here (SwiftPM
# builds for the host by default, so the visionOS-26 platform is not required
# to compile). On an Apple-silicon runner MTLCreateSystemDefaultDevice()
# succeeds, so the 63 GPU-gated tests actually RUN (and the MSL shaders compile
# at runtime) rather than skipping the way they do on a headless CPU box.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: swift build + test (native)
    runs-on: macos-15   # Apple silicon → Metal is available; GPU tests run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version || true

      # Always use the native build system: the default swiftbuild backend
      # fails codesigning on provenance xattrs (README "Build & test").
      - name: Build
        run: swift build --build-system native

      # Compiles the MSL at runtime via GPUContext and runs the 63 GPU-gated
      # tests. THRESHOLD_REQUIRE_GPU=1 makes GPUAvailabilityTests fail (not the
      # 63 tests silently skip) if this Apple-silicon runner ever loses its
      # Metal device — otherwise a broken image could report green with zero
      # GPU coverage.
      - name: Test
        run: swift test --build-system native
        env:
          THRESHOLD_REQUIRE_GPU: "1"

      # Golden-image regression gate. Non-gating for now: the recorded goldens
      # predate the color/tonemap pipeline and legitimately MISMATCH, and 9 of
      # 12 scenes have no golden yet (see Corpus/README.md). Once the goldens
      # are re-recorded (`Scripts/golden-suite.sh --update all`), drop
      # continue-on-error so a pixel drift fails the build.
      # TODO(golden-gate): remove continue-on-error after goldens are blessed.
      - name: Golden image suite (informational)
        continue-on-error: true
        run: Scripts/golden-suite.sh --no-build

  perf:
    name: perf suite (informational)
    runs-on: macos-15   # Apple silicon (M-family) — comparable-ish to the local baseline.
    timeout-minutes: 40
    # Non-gating: GitHub's shared runners are slower and noisier than the local
    # M-series baseline (bench-results/history.csv), so the ≥70-fps 2048² goal
    # will not hold here. This job runs the full multi-fractal matrix to catch
    # crashes / gross regressions and to surface the numbers in the log; it does
    # not gate the build.
    # TODO(perf-gate): gate on a pinned, dedicated runner with a runner-specific
    # target once one is available.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build (release)
        run: swift build --build-system native -c release --product threshold-render
      - name: Bench matrix
        run: Scripts/bench-suite.sh --no-build --frames 120 -m "CI ${{ github.sha }}"

  app-build:
    name: visionOS app (xcodebuild)  # informational until a visionOS-SDK runner is pinned
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true   # TODO: make this a hard gate on a runner that has the visionOS 26 SDK
    steps:
      - uses: actions/checkout@v4
      - name: Build Threshold.app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Threshold.xcodeproj \
            -scheme Threshold \
            -destination 'generic/platform=visionOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -60
